[package]
name = "banchou/banchou"
version = "0.1.0"
registry = "https://github.com/UpliftGames/wally-index"
realm = "shared"
license = "UNLICENSED"

# Phase 0 ne require AUCUN de ces paquets (cf. ADR-008) : le boot doit
# fonctionner avant même `wally install`. Ils entrent en jeu à partir de la
# Phase 1 (Trove) et de la Phase 2 (ProfileStore).
[dependencies]
Trove = "sleitnick/trove@1.5.0"
Signal = "sleitnick/signal@2.0.1"
Promise = "evaera/promise@4.0.0"

[server-dependencies]
ProfileStore = "loleris/profilestore@1.2.0"
